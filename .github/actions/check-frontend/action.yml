name: Check and build frontend
description: Validate the checked-out frontend revision and build its selected channel.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci
      shell: bash
      working-directory: frontend
    - run: npm run format:check
      shell: bash
      working-directory: frontend
    - run: npm run lint
      shell: bash
      working-directory: frontend
    - run: npm test
      shell: bash
      working-directory: frontend
    - run: npm run build
      shell: bash
      working-directory: frontend
    - run: npx playwright install --with-deps chromium
      shell: bash
      working-directory: frontend
    - run: npx playwright test --project=desktop --project=mobile
      shell: bash
      working-directory: frontend
